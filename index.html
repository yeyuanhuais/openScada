<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打开组态</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand"></div>
      <nav class="view-switch" aria-label="功能切换">
        <button type="button" class="tab is-active" data-tab="versions">版本浏览</button>
        <button type="button" class="tab" data-tab="replace">文件替换</button>
        <button type="button" class="tab" data-tab="extract">组态解压</button>
      </nav>
    </header>

    <main class="main">
      <section class="tab-panel active" id="tabVersions">
        <header class="header">
          <div class="title">打开组态</div>
          <div class="path" id="rootPath">未选择路径</div>
          <button id="selectRoot" class="primary">选择路径</button>
          <button id="refresh" class="ghost">刷新</button>
        </header>
        <section class="panel">
          <div class="group-label">
            版本筛选
            <button id="clearFilters" class="ghost filter-clear-btn">清空筛选</button>
          </div>
          <div class="filters">
            <div class="filter-row">
              <label class="filter-label" for="searchInput">关键词</label>
              <input id="searchInput" class="search-input" type="text" placeholder="输入版本号或名称筛选" />
            </div>
            <div class="filter-row">
              <span class="filter-label">前缀</span>
              <div id="prefixFilters" class="prefix-filters"></div>
            </div>
            <div class="filter-row">
              <span class="filter-label">版本</span>
              <div id="groupFilters" class="group-filters"></div>
            </div>
          </div>
        </section>
        <section class="panel">
          <div class="group-label">版本列表</div>
          <div id="versionList" class="version-list"></div>
        </section>
      </section>

      <section class="tab-panel" id="tabReplace">
        <section class="panel">
          <div class="group-label">固件文件替换</div>
          <div class="replace-form">
            <div class="field-row">
              <label for="sourceFolderInput">源文件夹</label>
              <div class="field-input">
                <input id="sourceFolderInput" type="text" />
                <button id="sourceBrowse" class="ghost">选择文件夹</button>
              </div>
            </div>
            <div class="field-row">
              <label for="versionInput">目标版本号</label>
              <input id="versionInput" type="text" />
              <div class="field-hint">可在"版本列表"中点击"替换"快速填入。</div>
            </div>
            <div class="field-actions">
              <button id="runReplace" class="primary">执行替换</button>
              <span id="replaceStatus" class="status-text"></span>
            </div>
          </div>
        </section>
        <section class="panel">
          <div class="group-label">执行日志</div>
          <pre id="replaceLog" class="log-panel">等待执行...</pre>
        </section>
      </section>

      <section class="tab-panel" id="tabExtract">
        <section class="panel">
          <div class="group-label">组态解压</div>
          <div class="extract-form">
            <div class="field-row">
              <label for="extractFolderInput">源文件夹</label>
              <div class="field-input">
                <input id="extractFolderInput" type="text" placeholder="输入或选择包含 zip 文件的文件夹路径" />
                <button id="extractBrowse" class="ghost">选择文件夹</button>
                <button id="scanZips" class="ghost">扫描文件</button>
              </div>
            </div>
            <div class="field-row">
              <label for="zipFileSelect">选择文件</label>
              <select id="zipFileSelect" class="zip-file-select" disabled>
                <option value="">-- 请先扫描文件夹 --</option>
              </select>
            </div>
            <div class="field-row">
              <label>解压目标</label>
              <div class="field-hint" id="extractDestHint">解压路径将基于"版本浏览"中选择的根目录，请先在版本浏览页选择路径。</div>
            </div>
            <div class="field-actions">
              <button id="runExtract" class="primary" disabled>执行解压</button>
              <span id="extractStatus" class="status-text"></span>
            </div>
            <div class="progress-wrap" id="extractProgressWrap" style="display: none">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="extractProgressFill"></div>
              </div>
              <span class="progress-label" id="extractProgressLabel">0%</span>
            </div>
          </div>
        </section>
        <section class="panel">
          <div class="group-label">执行日志</div>
          <pre id="extractLog" class="log-panel">等待执行...</pre>
        </section>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
